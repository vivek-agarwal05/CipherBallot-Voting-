services:
  - type: web
    name: cipherballot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --threads 4 --timeout 60 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cipherballot-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RSA_PRIVATE_KEY_PEM
        sync: false
      - key: RSA_PUBLIC_KEY_PEM
        sync: false
      - key: SIGNING_PRIVATE_KEY_PEM
        sync: false
      - key: SIGNING_PUBLIC_KEY_PEM
        sync: false

databases:
  - name: cipherballot-db
    plan: free
