{% extends "base.html" %}
{% block title %}Page Not Found — CipherBallot{% endblock %}
{% block topbar_title %}404 Not Found{% endblock %}
{% block content %}
<div style="text-align:center;padding:4rem 1rem">
  <div style="font-size:4rem;font-weight:800;color:var(--primary)">404</div>
  <h1 style="margin:.5rem 0 1rem">Page Not Found</h1>
  <p style="color:var(--text-muted);margin-bottom:1.5rem">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('public.index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
