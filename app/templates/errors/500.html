{% extends "base.html" %}
{% block title %}Server Error — CipherBallot{% endblock %}
{% block topbar_title %}500 Internal Server Error{% endblock %}
{% block content %}
<div style="text-align:center;padding:4rem 1rem">
  <div style="font-size:4rem;font-weight:800;color:var(--danger)">500</div>
  <h1 style="margin:.5rem 0 1rem">Something Went Wrong</h1>
  <p style="color:var(--text-muted);margin-bottom:1.5rem">An unexpected error occurred. The issue has been logged.</p>
  <a href="{{ url_for('public.index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
